[package]
name = "nord-buds-app"
version = "0.1.0"
description = "Buds Controller"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
btleplug = "0.11"
uuid = "1.0"
futures = "0.3"